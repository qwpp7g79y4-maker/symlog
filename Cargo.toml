[package]
name = "symlog"
version = "0.1.0"
edition = "2021"
# Opgehoogd in T2: `lru` vanaf de ondergrens die deny.toml eist (>=0.18.2, zie T1)
# vereist zelf rustc 1.85.0. Opgehoogd in T8: `ratatui` 0.29 bracht intern `lru 0.12`
# mee (zie docs/crates.md), wat de deny.toml-ondergrens uit T1 schendt; `ratatui` 0.30
# (via `ratatui-core`) gebruikt zelf `lru 0.18` en vereist rustc 1.88.0. Dit is precies
# het moment dat de T1-notitie ("wordt opnieuw bekeken zodra een latere taak een crate
# toevoegt die een hogere MSRV eist") bedoelde.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Terminal-logviewer voor Symfony/Monolog-logs, met vim-toetsen."
publish = false

[lib]
name = "symlog"
path = "src/lib.rs"

[[bin]]
name = "symlog"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", default-features = false, features = [
    "derive",
    "std",
    "help",
    "usage",
    "error-context",
] }
jiff = "0.2.38"
lru = "0.19.0"
memchr = "2.8.3"
memmap2 = { version = "0.9.12", optional = true }
notify = "8.2.0"
ratatui = { version = "0.30.2", default-features = false, features = [
    "crossterm",
    "layout-cache",
    "underline-color",
] }
regex = "1.13.1"
serde_json = "1.0.154"
shell-words = "1.1.1"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.0"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
proptest = "1.11.0"
tempfile = "3.27.0"

[features]
# mmap: snelle scan via memory-mapping, standaard uit. Afkappen van het bestand
# tijdens een actieve mmap kan SIGBUS geven (zie blueprint.md, T10); het standaardpad
# in T2 is daarom pread/seek, niet mmap.
mmap = ["dep:memmap2"]
