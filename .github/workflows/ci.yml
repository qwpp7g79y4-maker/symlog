name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Draait de 256 MiB-geheugen/tijdbenchmark uit T12 (`tests/gen_big.rs`,
  # `bench_mem_256mib_ci_fixture`) in release; de 2 GiB-variant blijft `#[ignore]` en
  # draait hier dus niet mee. Faalt op dit moment op het filter-tijdbudget (zie
  # docs/perf.md, "Niet gehaald"): dat is een gemeten, gerapporteerd tekort, geen
  # CI-configuratiefout.
  bench-mem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release bench_mem

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
