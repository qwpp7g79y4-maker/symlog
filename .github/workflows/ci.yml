name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # task.md T14: de strace-read-only-check draait alleen op Linux en wordt anders
      # stilletjes overgeslagen; dit garandeert dat hij op ubuntu-latest ook echt
      # draait in plaats van skipt.
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y strace
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Draait de 256 MiB-geheugen/tijdbenchmark uit T12 (`tests/gen_big.rs`,
  # `bench_mem_256mib_ci_fixture`) in release; de 2 GiB-variant blijft `#[ignore]` en
  # draait hier dus niet mee. Faalt op dit moment op het filter-tijdbudget (zie
  # docs/perf.md, "Niet gehaald"): dat is een gemeten, gerapporteerd tekort, geen
  # CI-configuratiefout.
  bench-mem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release bench_mem

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # task.md T15 "Klaar als": "geen persoonsnamen of handles in de repo (`rg` op een
  # lijst verboden woorden als CI-stap)". Gebruikt `grep` (geen extra tool nodig op
  # de runner) over precies de ingecheckte bestanden (`git ls-files`), met de lijst
  # uit `docs/forbidden-words.txt`.
  forbidden-words:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          patterns=$(mktemp)
          grep -vE '^(#|[[:space:]]*$)' docs/forbidden-words.txt > "$patterns"
          if git ls-files -z \
              | grep -zv '^docs/forbidden-words\.txt$' \
              | xargs -0 grep -niE -f "$patterns" --; then
            echo "Verboden woord gevonden (zie hierboven); verwijder het uit het publieke bestand."
            exit 1
          fi
